[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xuexitong-plus"
version = "0.1.0"
description = "学习通（超星）只读查询 MCP Server + 桌面悬浮窗：课表(含 .ics 导出) / 作业截止 / 进度 / 通知"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wu Jiale" }]
keywords = ["chaoxing", "xuexitong", "mcp", "model-context-protocol", "hypergryph"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
]
dependencies = [
    "mcp==1.19.0",
    "pydantic>=2.11,<2.12",
    "beautifulsoup4>=4.12,<5",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "requests>=2.28",
    "pycryptodome>=3.19",
]

[project.scripts]
xuexitong-plus = "xuexitong_mcp.plus:main"
Xuexitong-mcp = "xuexitong_mcp.plus:main"
xuexitong-assistant = "xuexitong_mcp.widget:main"

[project.urls]
Homepage = "https://github.com/xiny8127-glitch/xuexitong-plus"

[tool.setuptools]
packages = ["xuexitong_mcp"]

